services:
  mysql:
    image: mysql:8.0
    container_name: skilltwin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: skilltwin_dev_password
      MYSQL_DATABASE: skilltwin
      MYSQL_USER: skilltwin_app
      MYSQL_PASSWORD: skilltwin_app_password
    ports:
      - "3306:3306"
    volumes:
      - skilltwin_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pskilltwin_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  skilltwin_mysql_data:
